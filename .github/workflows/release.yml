name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The Linux engine (`jetlined`), one per architecture, built natively. The
  # app's "Connect a Machine" installs these from the release (see
  # Client/RemoteInstaller.swift), so they're attached to it as
  # jetlined-linux-<arch>.gz.
  linux-daemon:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: swift:6.4-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dependencies
        # libsqlite3.so is removed so the link takes libsqlite3.a: the binary
        # then needs nothing beyond glibc ≥ 2.35 and libstdc++.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev
          rm -f /usr/lib/*-linux-gnu/libsqlite3.so

      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/static let embedded = \".*\"/static let embedded = \"$VERSION\"/" Sources/JetlineApp/Daemon/JetlineDaemon.swift

      - name: Build jetlined
        run: |
          swift build -c release --product jetlined --static-swift-stdlib --build-system native
          BIN=$(swift build -c release --product jetlined --build-system native --show-bin-path)/jetlined
          strip "$BIN"
          "$BIN" version
          gzip -9 -c "$BIN" > jetlined-linux-${{ matrix.arch }}.gz

      - uses: actions/upload-artifact@v4
        with:
          name: jetlined-linux-${{ matrix.arch }}
          path: jetlined-linux-${{ matrix.arch }}.gz

  release:
    needs: linux-daemon
    # Xcode 27 (preview image): Jetline builds against the macOS 27 SDK
    # (NSSegmentedControl.role etc.), which Xcode 26.x doesn't have.
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      DEVELOPER_ID: "Developer ID Application: MARTIN JOHANNES RYBERG LAUDE (${{ secrets.APPLE_TEAM_ID }})"
      NOTARY_PROFILE: jetline-notary

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # generate-appcast / CFBundleVersion need full history

      - name: Fetch the Linux engine builds
        uses: actions/download-artifact@v4
        with:
          pattern: jetlined-linux-*
          path: daemon

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        env:
          P12_BASE64:        ${{ secrets.MAC_DEV_ID_CERT_P12_BASE64 }}
          P12_PASSWORD:      ${{ secrets.MAC_DEV_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"

          echo "$P12_BASE64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KC" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          rm /tmp/cert.p12

          security list-keychains -d user -s "$KC" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KC"

      - name: Store notarytool credentials
        env:
          APPLE_ID:               ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:          ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PWD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PWD"

      - name: Resolve SPM dependencies
        run: make resolve

      - name: Derive version from tag, bump Info.plist
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" BundleResources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD"               BundleResources/Info.plist

      - name: Build, sign, DMG, notarize, staple
        run: make release

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p releases
          cp "dist/Jetline-${{ steps.ver.outputs.version }}.dmg" releases/
          ./scripts/generate-appcast.sh ./releases

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
              "dist/Jetline-${{ steps.ver.outputs.version }}.dmg" \
              --title "Jetline ${{ steps.ver.outputs.version }}" \
              --generate-notes

      - name: Publish appcast to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-appcast.sh

      - name: Attach the Linux engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.ver.outputs.version }}" daemon/*/jetlined-linux-*.gz

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
